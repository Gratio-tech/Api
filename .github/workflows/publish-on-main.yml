name: Publish package to npm (on push to main)

on:
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    name: Test, build and publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19   # явно, чтобы не ловить latest

      - name: Restore Bun global install cache
        uses: actions/cache@v4
        id: bun-cache
        with:
          path: ${{ env.HOME }}/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock','**/bun.lockb','**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies (reproducible)
        run: bun ci

      - name: Save Bun cache (if changed)
        if: steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.HOME }}/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock','**/bun.lockb','**/package.json') }}

      - name: Run tests
        run: bun test

      - name: Build (tsup)
        run: bun run build

      - name: Ensure package is not private
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            if (pkg.private) {
              console.error('package.json.private is true — aborting publish');
              process.exit(1);
            }
          "

      - name: Set next stable patch version
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          NPM_LATEST="$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null || true)"
          export NPM_LATEST
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const parseStableVersion = value => {
            const [core] = String(value).split('-');
            const parts = core.split('.').map(Number);
            if (
              parts.length !== 3 ||
              parts.some(part => !Number.isInteger(part) || part < 0)
            ) {
              throw new Error(`Invalid semver version: ${value}`);
            }
            return parts;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) {
                return left[index] - right[index];
              }
            }
            return 0;
          };
          const requested = parseStableVersion(pkg.version);
          const latest = process.env.NPM_LATEST
            ? parseStableVersion(process.env.NPM_LATEST)
            : null;
          const next =
            latest && compare(requested, latest) <= 0
              ? [latest[0], latest[1], latest[2] + 1]
              : requested;
          pkg.version = next.join('.');
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          console.log(`Publishing ${pkg.name}@${pkg.version}`);
          NODE

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Authenticate to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}

      - name: Show package.json tail
        run: cat -A package.json | tail -20

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --tag latest --provenance
